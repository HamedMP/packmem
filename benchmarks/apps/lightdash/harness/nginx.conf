# A reverse proxy in front of Lightdash, as a production install has one. Lightdash's own server does not compress
# API responses (it only serves pre-gzipped frontend assets), so this proxy is what gzips the JSON pages: zlib level
# 6, the zlib default and the level packmem's CompressionStream uses. packmem bytes are not in gzip_types: packmem/http
# gzips them inside the payload (Content-Type `application/vnd.packmem; enc=gzip`) when the client asks.
worker_processes 2;
events { worker_connections 1024; }
http {
    log_format bench escape=json '{"t":"$time_iso8601","run":"$http_x_bench_run","arm":"$http_x_bench_arm",'
        '"uri":"$request_uri","status":$status,"bytes_sent":$bytes_sent,"body_bytes":$body_bytes_sent,'
        '"type":"$sent_http_content_type","enc":"$sent_http_content_encoding",'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
    access_log /var/log/nginx/bench.jsonl bench;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json;

    client_max_body_size 50m;
    proxy_buffering on;
    proxy_read_timeout 600s;

    server {
        listen 80;
        location /bench/ {
            root /usr/share/nginx;
            types { text/html html; text/javascript js; application/wasm wasm; }
            add_header cache-control no-store;
        }
        location / {
            proxy_pass http://lightdash:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }
    }
}
