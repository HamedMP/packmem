name: release
# Builds the Python wheels and source distribution.
#   Run manually:  build and test everything; upload to TestPyPI if TESTPYPI_TRUSTED_PUBLISHING is 'true'.
#   Push a v* tag: build and test everything; upload to PyPI if PYPI_TRUSTED_PUBLISHING is 'true'.
# Both uploads use PyPI trusted publishing (no tokens); the publisher has to be registered
# for this repository and workflow on test.pypi.org and pypi.org first.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          - { os: macos-latest, target: x86_64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release -o dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: python/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with: { working-directory: python, command: sdist, args: -o dist }
      - name: the source distribution holds only the package and the core crate
        run: |
          tar -tzf python/dist/*.tar.gz
          test "$(tar -tzf python/dist/*.tar.gz | wc -l)" -lt 60
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: it builds and passes the tests from source
        run: |
          pip install python/dist/*.tar.gz
          python python/tests/test_packmem.py
          python python/tests/test_paths.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sdist, path: python/dist }

  test-install:
    name: install and test the built wheel (${{ matrix.os }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: "wheel-*", path: wheels, merge-multiple: true }
      - run: pip install --no-index --find-links wheels packmem
      - name: the installed package carries its licence
        run: python -c "import importlib.metadata as m; fs = [str(f) for f in m.files('packmem')]; assert any('LICENSE' in f for f in fs), fs"
      - run: python python/tests/test_packmem.py
      - run: python python/tests/test_paths.py

  testpypi:
    # uploads need a trusted publisher registered on the index; set the repository variable once that is done
    if: github.event_name == 'workflow_dispatch' && vars.TESTPYPI_TRUSTED_PUBLISHING == 'true'
    needs: [test-install, sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with: { repository-url: "https://test.pypi.org/legacy/" }

  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_TRUSTED_PUBLISHING == 'true'
    needs: [test-install, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
