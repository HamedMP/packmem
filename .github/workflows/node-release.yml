name: node-release
# Builds the Node addon for every supported platform, tests the packed tarball on each, and publishes to npm on a
# v* tag (the same tags as the PyPI release). A manual run does everything except publish, unless `publish` is set
# (to finish a tagged release whose publish step failed).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm after the tests pass
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: addon ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.17 keeps the Linux builds loadable on old distributions (Amazon Linux 2, RHEL 7 and newer)
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: x86_64-unknown-linux-gnu.2.17, lib: libpackmem_node.so }
          - { name: linux-arm64, os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zig: aarch64-unknown-linux-gnu.2.17, lib: libpackmem_node.so }
          - { name: linux-x64-musl, os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: x86_64-unknown-linux-musl, lib: libpackmem_node.so }
          - { name: linux-arm64-musl, os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: aarch64-unknown-linux-musl, lib: libpackmem_node.so }
          - { name: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin, lib: libpackmem_node.dylib }
          - { name: darwin-x64, os: macos-latest, target: x86_64-apple-darwin, lib: libpackmem_node.dylib }
          - { name: win32-x64, os: windows-latest, target: x86_64-pc-windows-msvc, lib: packmem_node.dll }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, targets: "${{ matrix.target }}" }
      - name: Build with zig (Linux)
        if: matrix.zig
        working-directory: node
        env:
          # a musl cdylib must link the C runtime dynamically to be loadable by Node
          RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=-crt-static' || '' }}
        run: |
          pip install --quiet cargo-zigbuild
          cargo zigbuild --release --target ${{ matrix.zig }}
      - name: Build (macOS, Windows)
        if: ${{ !matrix.zig }}
        working-directory: node
        run: cargo build --release --target ${{ matrix.target }}
      - name: Name the addon as the loader expects
        shell: bash
        run: |
          mkdir -p dist
          cp node/target/${{ matrix.target }}/release/${{ matrix.lib }} dist/packmem.${{ matrix.name }}.node
          ls -la dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "addon-${{ matrix.name }}", path: dist/*.node, if-no-files-found: error }

  pack:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: addon-*, path: node, merge-multiple: true }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, targets: wasm32-unknown-unknown }
      - name: Build the WebAssembly binding
        working-directory: node
        run: |
          cargo install wasm-bindgen-cli --version "$(grep -oE 'wasm-bindgen = "=[0-9.]+"' wasm/Cargo.toml | grep -oE '[0-9.]+[0-9]')" --locked
          node scripts/build-wasm.mjs
      - id: v
        name: Check the version against the tag
        working-directory: node
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} does not match node/package.json version $version"; exit 1
          fi
      - name: Pack
        working-directory: node
        run: |
          ls -la *.node
          test "$(ls *.node | wc -l)" -eq 7
          test -s wasm-dist/packmem_bg.wasm
          npm pack
          tar -tzf packmem-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: tarball, path: node/packmem-*.tgz, if-no-files-found: error }

  smoke:
    needs: pack
    name: install and run on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: linux-x64-musl, os: ubuntu-latest, docker: "node:22-alpine" }
          - { name: linux-arm64-musl, os: ubuntu-24.04-arm, docker: "node:22-alpine" }
          - { name: darwin-arm64, os: macos-latest }
          - { name: darwin-x64, os: macos-latest, arch: x64 }
          - { name: win32-x64, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { sparse-checkout: node/scripts }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: tarball, path: pkg }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !matrix.docker }}
        with: { node-version: 22, architecture: "${{ matrix.arch || '' }}" }
      - name: Install the tarball and run it
        if: ${{ !matrix.docker }}
        shell: bash
        run: |
          node -p "process.platform + '-' + process.arch"
          mkdir smoke && cd smoke && npm init -y > /dev/null
          npm install ../pkg/packmem-*.tgz
          cp ../node/scripts/smoke.mjs . && node smoke.mjs
      - name: Install the tarball and run it (Alpine)
        if: matrix.docker
        run: |
          docker run --rm -v "$PWD:/w" -w /w ${{ matrix.docker }} sh -c '
            node -p "process.platform + \"-\" + process.arch" &&
            mkdir smoke && cd smoke && npm init -y > /dev/null &&
            npm install ../pkg/packmem-*.tgz && cp ../node/scripts/smoke.mjs . && node smoke.mjs'

  publish:
    needs: [pack, smoke]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: tarball, path: pkg }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      # trusted publishing (OIDC) needs npm 11.5 or later, and the npmjs.com trusted publisher must allow `npm publish`
      - run: npm install -g npm@11
      - name: Publish with provenance
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish ./pkg/packmem-*.tgz --provenance --access public --tag "$tag"
