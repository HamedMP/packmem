name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path python/Cargo.toml
      - run: cargo clippy --release --all-targets

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest] }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: PyO3/maturin-action@v1
        with: { working-directory: python, args: --release -o dist, manylinux: auto }
      - run: pip install python/dist/*.whl
      - run: python python/tests/test_packmem.py
      - run: python python/tests/test_paths.py
      - run: pip install hypothesis && python python/tests/test_properties.py
      - uses: actions/upload-artifact@v4
        with: { name: "wheel-${{ matrix.os }}-py${{ matrix.python }}", path: python/dist }
