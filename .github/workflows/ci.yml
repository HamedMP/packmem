name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # one group per pull request, but one per commit on main: a queued run on main must not be replaced by the next push
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # several people push to main in quick succession; every commit there should get a full run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path python/Cargo.toml
      - run: cargo clippy --release --all-targets

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - run: cargo test --release

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "${{ matrix.python }}" }
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with: { working-directory: python, args: --release -o dist, manylinux: auto }
      - run: pip install --no-index --find-links python/dist packmem
      - run: python python/tests/test_packmem.py
      - run: python python/tests/test_paths.py
      - run: pip install hypothesis && python python/tests/test_properties.py
      - name: Django loader
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: pip install django && python python/tests/test_paths.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "wheel-${{ matrix.os }}-py${{ matrix.python }}", path: python/dist }
