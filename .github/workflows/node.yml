name: node
on:
  push:
    branches: [main]
    paths: ["node/**", "src/**", "Cargo.toml", ".github/workflows/node.yml"]
  pull_request:
    paths: ["node/**", "src/**", "Cargo.toml", ".github/workflows/node.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ matrix.node }}" }
      - name: Build the addon
        working-directory: node
        run: npm run build
      - name: Test
        working-directory: node
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == 22
        with:
          name: addon-${{ matrix.os }}
          path: node/*.node

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: packmem
          POSTGRES_PASSWORD: packmem
          POSTGRES_DB: packmem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U packmem" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - working-directory: node
        run: npm ci && npm run build
      - name: Test against Postgres
        working-directory: node
        env:
          PACKMEM_PG_URL: postgres://packmem:packmem@localhost:5432/packmem
        run: npm test
