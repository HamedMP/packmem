name: node
on:
  push:
    branches: [main]
    paths: ["node/**", "src/**", "python/src/**", "Cargo.toml", ".github/workflows/node.yml"]
  pull_request:
    paths: ["node/**", "src/**", "python/src/**", "Cargo.toml", ".github/workflows/node.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ matrix.node }}" }
      - name: Build the addon
        working-directory: node
        run: npm run build
      - name: Test
        working-directory: node
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == 22
        with:
          name: addon-${{ matrix.os }}
          path: node/*.node

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: packmem
          POSTGRES_PASSWORD: packmem
          POSTGRES_DB: packmem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U packmem" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - working-directory: node
        run: npm ci && npm run build
      - name: Test against Postgres
        working-directory: node
        env:
          PACKMEM_PG_URL: postgres://packmem:packmem@localhost:5432/packmem
        run: npm test

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Build the addon and the WebAssembly binding
        working-directory: node
        run: |
          cargo install wasm-bindgen-cli --version "$(grep -oE 'wasm-bindgen = "=[0-9.]+"' wasm/Cargo.toml | grep -oE '[0-9.]+[0-9]')" --locked
          npm run build
          node scripts/build-wasm.mjs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with: { working-directory: python, args: --release -o dist, manylinux: auto }
      - run: pip install --no-index --find-links python/dist packmem
      - name: WebAssembly gives the same results as the addon, and every binding reads the others' bytes
        working-directory: node
        env:
          PACKMEM_PYTHON: python
        run: node --test test/wasm.test.js test/bytes.test.js test/load.test.js
      - name: A browser reads tables from Node and Python servers; the React hook
        working-directory: node
        env:
          PACKMEM_PYTHON: python
          PACKMEM_REQUIRE_BROWSER: "1"
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          node --test test/browser.test.js test/react-browser.test.js test/react.test.js test/http.test.js
