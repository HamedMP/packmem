[package]
name = "packmem-node"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
packmem = { path = ".." }
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
serde = "1"
itoa = "1"
ryu = "1"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "raw_value"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
