[package]
name = "packmem"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Packed, operation-aware columns for record collections: filter and aggregate in memory without decompressing."
license = "Apache-2.0"
authors = ["Finna Labs Inc."]
readme = "README.md"
keywords = ["compression", "columnar", "memory", "encoding"]
categories = ["compression", "data-structures"]
include = ["/src/**", "/tests/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[features]
default = ["baselines"]
# LZ4 and Zstandard are only used as baselines by the comparison benchmark (src/bin/bench.rs).
# Bindings and WebAssembly builds depend on the crate with `default-features = false`, which
# leaves it without any C code.
baselines = ["dep:lz4_flex", "dep:zstd"]

[dependencies]
fsst-rs = "0.7.0"
lz4_flex = { version = "0.14.0", optional = true }
serde_json = "1.0.154"
zstd = { version = "0.14.4", optional = true }

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["baselines"]
