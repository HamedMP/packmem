[package]
name = "packmem-py"
version = "0.3.3"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "_packmem"
crate-type = ["cdylib"]

[dependencies]
packmem = { path = "..", default-features = false, features = ["ztext"] }
pyo3 = { version = "0.23", features = ["abi3-py310"] }
memmap2 = "0.9"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "raw_value"] }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[lints.rust]
# builds the Linux load allocator on other systems, to test it there
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(packmem_test_load_alloc)'] }
