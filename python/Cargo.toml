[package]
name = "packmem-py"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "_packmem"
crate-type = ["cdylib"]

[dependencies]
packmem = { path = "..", default-features = false, features = ["ztext"] }
pyo3 = { version = "0.23", features = ["abi3-py310"] }
memmap2 = "0.9"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "raw_value"] }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
