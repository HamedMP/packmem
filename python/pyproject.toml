[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "packmem"
version = "0.3.0.dev0"
description = "A list of dicts that takes a fraction of the memory: packed columns you can filter and aggregate without unpacking."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE"]
authors = [{ name = "Finna Labs Inc." }]
keywords = ["memory", "compression", "columnar", "json", "records"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://hamedmp.github.io/packmem/"
Repository = "https://github.com/HamedMP/packmem"
Changelog = "https://github.com/HamedMP/packmem/blob/main/CHANGELOG.md"
Issues = "https://github.com/HamedMP/packmem/issues"

[tool.maturin]
python-source = "py"
module-name = "packmem._packmem"
features = ["pyo3/extension-module"]
